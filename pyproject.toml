[project]
name = "hub8002"
version = "0.1.0"
description = "Exposure- and position-aware hub detection in football passing networks (HKU DATA8002 group project, topic C)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "matplotlib", "networkx", "pyyaml"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
