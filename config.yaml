# 开工前要定的 12 个决定（全部按"推荐"执行；备选项用于敏感性分析）
seasons:            # StatsBomb season_id -> 赛季（competition 11 = 西甲）
  37: "2004/05"
  38: "2005/06"
  39: "2006/07"
  40: "2007/08"
  41: "2008/09"
  21: "2009/10"
  22: "2010/11"
  23: "2011/12"
  24: "2012/13"
  25: "2013/14"
  26: "2014/15"
  27: "2015/16"
  2:  "2016/17"
  1:  "2017/18"
  4:  "2018/19"
  42: "2019/20"
  90: "2020/21"
league_season: "2015/16"
focus_team: "Barcelona"

# 决定 12：早期赛季在 E4 中合并为里杰卡尔德时期；E3 只用 >= 20 场的赛季
eras:
  "Rijkaard 2004-08": ["2004/05", "2005/06", "2006/07", "2007/08"]
e3_min_matches: 20

# 决定 3、4：两层传球
set_piece_types: ["Corner", "Free Kick", "Throw-in", "Goal Kick", "Kick Off"]
box: {x_min: 102.0, y_min: 18.0, y_max: 62.0}   # StatsBomb 120 x 80 坐标
box_layer_excludes_set_pieces: true              # 补充说明：威胁层同样去掉定位球（与决定 3 的理由一致）

# 决定 6：位置分组（边锋归前锋，边前卫归中场）
position_groups:
  Goalkeeper: GK
  Right Back: DEF
  Right Center Back: DEF
  Center Back: DEF
  Left Center Back: DEF
  Left Back: DEF
  Right Wing Back: DEF
  Left Wing Back: DEF
  Right Defensive Midfield: MID
  Center Defensive Midfield: MID
  Left Defensive Midfield: MID
  Right Midfield: MID
  Right Center Midfield: MID
  Center Midfield: MID
  Left Center Midfield: MID
  Left Midfield: MID
  Right Attacking Midfield: MID
  Center Attacking Midfield: MID
  Left Attacking Midfield: MID
  Right Wing: FWD
  Left Wing: FWD
  Right Center Forward: FWD
  Center Forward: FWD
  Left Center Forward: FWD
  Secondary Striker: FWD
# 敏感性分析 1：边锋归中场
position_groups_alt_wingers_mid: [Right Wing, Left Wing]
# 敏感性分析 2：更细的六类角色（中卫 / 边后卫 / 中路中场 / 边路中场 / 边锋 / 中锋）
position_roles:
  Goalkeeper: GK
  Right Back: FB
  Left Back: FB
  Right Wing Back: FB
  Left Wing Back: FB
  Right Center Back: CB
  Center Back: CB
  Left Center Back: CB
  Right Defensive Midfield: CM
  Center Defensive Midfield: CM
  Left Defensive Midfield: CM
  Right Center Midfield: CM
  Center Midfield: CM
  Left Center Midfield: CM
  Right Attacking Midfield: CM
  Center Attacking Midfield: CM
  Left Attacking Midfield: CM
  Right Midfield: WM
  Left Midfield: WM
  Right Wing: W
  Left Wing: W
  Right Center Forward: CF
  Center Forward: CF
  Left Center Forward: CF
  Secondary Striker: CF

# 决定 2：门将不参与枢纽判定
hub_groups: [DEF, MID, FWD]
# 决定 7：纳入哪些球员
min_minutes: 90
# 决定 8、9、10、11
model:
  s_max: 3
  rho_max: 4.0
  prior_shape: 1.0
  n_rho_grid: 400        # Poisson model (closed form in lambda)
  n_rho_grid_het: 60     # heterogeneity-aware model (checked against 400 x 300 grids)
  n_lambda_grid: 50
# v2：核心 = 某方面贡献的价值显著超过同位置普通球员（价值单位：预期进球）
layers: [att, prog, def, org]   # 进攻 / 组织推进 / 防守 / 传球量（对照）
core_model:                      # v2 核心模型（src/hub8002/models/core_model.py）
  delta_min_frac: 0.25           # 核心每 90 分钟至少比同位置普通球员多贡献 0.25 x 联盟球员平均值
  delta_max_frac: 4.0
  s_max: 3
seed: 8002
